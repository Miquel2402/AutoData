
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de datos personales | AutoData</title>
</head>
<body>

    <h1>Formulario de datos personales</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Datos personales</legend>

            <div>
                <label for="email">Correo electrónico *</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="usuario@ejemplo.com"
                    required
                    aria-describedby="email-ayuda">

                <small id="email-ayuda">
                    Introduce una dirección de correo electrónico válida.
                </small>
            </div>


            <div>
                <label for="telefono">Teléfono *</label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="+34 666 777 888"
                    pattern="^\+34 [0-9]{3} [0-9]{3} [0-9]{3}$"
                    required
                    aria-describedby="telefono-ayuda">

                <small id="telefono-ayuda">
                    Introduce el teléfono con el formato +34 666 777 888.
                </small>
            </div>


            <div>
                <label for="fecha-nacimiento">Fecha de nacimiento *</label>

                <input
                    type="date"
                    id="fecha-nacimiento"
                    name="fecha-nacimiento"
                    max="2008-11-09"
                    required
                    aria-describedby="fecha-ayuda">

                <small id="fecha-ayuda">
                    Debes tener al menos 18 años.
                </small>
            </div>


            <div>
                <label for="password">Contraseña *</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required
                    aria-describedby="password-ayuda">

                <small id="password-ayuda">
                    La contraseña debe tener al menos 8 caracteres.
                </small>
            </div>


        </fieldset>


        <div>
            <button type="submit">Enviar</button>
            <button type="reset">Limpiar</button>
        </div>


    </form>


</body>
</html>
