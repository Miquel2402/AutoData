<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo | AutoData</title>
  <meta name="description" content="Catálogo de coches con buscador y filtros." />
  <link rel="stylesheet" href="css/estilos.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">A</span>
        <span>AutoData</span>
      </a>
      <nav aria-label="Menú principal" class="main-nav">
        <button class="menu-toggle" aria-expanded="false" aria-controls="menu-principal">Menú</button>
        <ul id="menu-principal">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="marcas.html">Marcas</a></li>
          <li><a href="catalogo.html" aria-current="page">Catálogo</a></li>
          <li><a href="comparador.html">Comparador</a></li>
          <li><a href="guia.html">Guía</a></li>
          <li><a href="novedades.html">Novedades</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido" class="page-main">
    <div class="container">
      <header class="page-header">
        <p class="eyebrow">Catálogo</p>
        <h1>Todos los coches</h1>
      </header>

      <div class="filters">
        <label>
          Buscar:
          <input type="search" id="searchInput" placeholder="Marca o modelo" />
        </label>
        <label>
          Combustible:
          <select id="fuelFilter">
            <option value="">Todos</option>
            <option value="Gasolina">Gasolina</option>
            <option value="Diésel">Diésel</option>
            <option value="Híbrido">Híbrido</option>
          </select>
        </label>
      </div>

      <div id="catalogo" class="cards-grid cards-grid-3" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><h3>AutoData</h3><p>Proyecto académico.</p></div>
      <div><h4>Navegación</h4><ul><li><a href="index.html">Inicio</a></li><li><a href="marcas.html">Marcas</a></li></ul></div>
      <div><h4>Contacto</h4><ul><li><a href="contacto.html">Formulario</a></li></ul></div>
      <div><h4>Autor</h4><p>Miquel Santos Bay</p></div>
    </div>
  </footer>
</body>
</html>
