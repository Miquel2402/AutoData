<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto | AutoData</title>
  <meta name="description" content="Formulario de contacto de AutoData." />
  <link rel="stylesheet" href="css/estilos.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">A</span>
        <span>AutoData</span>
      </a>
      <nav aria-label="Menú principal" class="main-nav">
        <button class="menu-toggle" aria-expanded="false" aria-controls="menu-principal">Menú</button>
        <ul id="menu-principal">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="marcas.html">Marcas</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="comparador.html">Comparador</a></li>
          <li><a href="guia.html">Guía</a></li>
          <li><a href="novedades.html">Novedades</a></li>
          <li><a href="contacto.html" aria-current="page">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido" class="page-main">
    <div class="container narrow">
      <header class="page-header">
        <p class="eyebrow">Contacto</p>
        <h1>Envíanos tu consulta</h1>
      </header>

      <form id="contactForm" class="contact-form" novalidate>
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" required minlength="2" />
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="form-group">
          <label for="asunto">Asunto</label>
          <input id="asunto" name="asunto" type="text" required minlength="3" />
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" required minlength="10" rows="5"></textarea>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="acepto" required />
          Acepto que este formulario es una demostración educativa.
        </label>

        <button type="submit" class="btn btn-primary">Enviar</button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><h3>AutoData</h3><p>Proyecto académico.</p></div>
      <div><h4>Información</h4><ul><li><a href="faq.html">FAQ</a></li><li><a href="guia.html">Guía</a></li></ul></div>
      <div><h4>Navegación</h4><ul><li><a href="index.html">Inicio</a></li><li><a href="catalogo.html">Catálogo</a></li></ul></div>
      <div><h4>Autor</h4><p>Miquel Santos Bay</p></div>
    </div>
  </footer>
</body>
</html>
